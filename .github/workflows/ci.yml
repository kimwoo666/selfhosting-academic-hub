name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-cpp-academic-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-cpp-academic-hub/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile crawler
        run: python -m py_compile scripts/crawl_grades.py

      - name: Run parser tests
        run: python -m unittest discover -s tests/python -p "test_*.py"

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libsqlite3-dev libssl-dev zlib1g-dev

      - name: Configure CMake
        run: cmake -S . -B build_cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build backend
        run: cmake --build build_cpp --parallel

      - name: Run CTest
        run: ctest --test-dir build_cpp --output-on-failure
